name: ci

on:
  push:
  pull_request:

jobs:
  test-x86_64:
    name: test (x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace --all-targets
      - name: Fallback demo
        run: cargo run -p gpucache-transport --bin fault-demo --quiet
      - name: Paired baseline stub
        run: cargo run -p gpucache-bench --bin paired-baseline --quiet
      - name: Shard and cold demos
        run: |
          cargo run -p gpucache-transport --bin shard-demo --quiet
          cargo run -p gpucache-cold --bin cold-demo --quiet
      - name: Optional RDMA feature still skips hardware
        run: cargo test -p gpucache-transport --all-targets --features rdma-nixl
      - name: Reject accelerator linkage and erasure coding
        run: |
          python3 - <<'PY'
          import pathlib, re, sys
          bad = re.compile(
              r"^(cuda|doca|nixl|rdma|spdk|libnixl)([-_a-z0-9]*)?\s*=",
              re.I,
          )
          failed = False
          for path in pathlib.Path("crates").glob("*/Cargo.toml"):
              in_deps = False
              for lineno, line in enumerate(path.read_text().splitlines(), 1):
                  stripped = line.split("#", 1)[0].strip()
                  if stripped.startswith("[") and stripped.endswith("]"):
                      in_deps = "dependencies" in stripped
                      continue
                  if in_deps and bad.match(stripped):
                      print(f"{path}:{lineno}: accelerator dependency is not allowed")
                      failed = True
          if failed:
              sys.exit(1)
          PY
          if grep -RInE 'reed_solomon|erasure_coding|parity_shard' crates --include '*.rs'; then
            echo "erasure coding must not be added"
            exit 1
          fi
      - name: Keep the cold tier off the hot path
        run: |
          if grep -n 'gpucache-cold' crates/storage/Cargo.toml crates/transport/Cargo.toml crates/protocol/Cargo.toml crates/core-types/Cargo.toml; then
            echo "RustFS cold tier must not be a hot-path dependency"
            exit 1
          fi

  test-aarch64:
    name: test (aarch64 runner)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test
        run: |
          echo "aarch64 cargo test is a CPU build. It is not a BlueField or DOCA run."
          cargo test --workspace --all-targets

  test-aarch64-qemu:
    name: test (aarch64 qemu-user)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu qemu-user-static libc6-dev-arm64-cross
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - name: Test under qemu-aarch64
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUNNER: qemu-aarch64-static -L /usr/aarch64-linux-gnu
        run: cargo test --workspace --all-targets --target aarch64-unknown-linux-gnu
