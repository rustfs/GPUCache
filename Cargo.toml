[workspace]
resolver = "2"
members = [
    "crates/core-types",
    "crates/protocol",
    "crates/storage",
    "crates/cold",
    "crates/transport",
    "crates/bench",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.85"
authors = ["RustFS, Inc."]
repository = "https://github.com/rustfs/gpucache"

[workspace.dependencies]
sha2 = "=0.10.8"
gpucache-core-types = { path = "crates/core-types" }
gpucache-protocol = { path = "crates/protocol" }
gpucache-storage = { path = "crates/storage" }
gpucache-cold = { path = "crates/cold" }
gpucache-transport = { path = "crates/transport" }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
doc_markdown = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
struct_excessive_bools = "allow"
