[package]
name = "gpucache-transport"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Localhost TCP transport for GPUCache. Optional rdma-nixl feature does not link a device."
publish = false

[features]
default = []
# Slot only. Does not pull a native library. See docs/adr/0004-nixl-transport.md.
rdma-nixl = []

[dependencies]
gpucache-core-types.workspace = true
gpucache-protocol.workspace = true
gpucache-storage.workspace = true

[[bin]]
name = "gpucache-tcp"
path = "src/bin/gpucache_tcp.rs"

[[bin]]
name = "share-demo"
path = "src/bin/share_demo.rs"

[[bin]]
name = "fault-demo"
path = "src/bin/fault_demo.rs"

[[bin]]
name = "shard-demo"
path = "src/bin/shard_demo.rs"

[lints]
workspace = true
